version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: logitrack-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - logitrack-network

  mysqldb:
    image: mysql:8.0
    container_name: logitrack-mysql
    restart: always
    environment:
      MYSQL_DATABASE: logitrack_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    networks:
      - logitrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: logitrack-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/logitrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - logitrack-network

networks:
  logitrack-network:
    driver: bridge