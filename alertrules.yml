groups:
  - name: logitrack-alerts
    rules:
      - alert: ApiInstanceDown
        expr: up{job="logitrack-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "LogiTrack API is DOWN"

      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx Error Rate detected"

      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "JVM Heap Memory Usage is above 85%"

      - alert: SlowResponseTime
        expr: rate(http_server_requests_seconds_sum[1m]) / rate(http_server_requests_seconds_count[1m]) > 1.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API Response time is higher than 1.5s"